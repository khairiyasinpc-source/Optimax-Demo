              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  adBlockEnabled = getPreferences(MODE_PRIVATE).getBoolean("ad_block", true);
                  compatibilityCookies = getPreferences(MODE_PRIVATE).getBoolean("player_cookies", true);
                  immersive();
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(7,10,18));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(7,10,18));
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  cursor = new Cursor();
                  cursor.setVisibility(View.GONE);
                  root.addView(cursor, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
          
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setBuiltInZoomControls(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setTextZoom(100);
                  s.setLoadsImagesAutomatically(true);
                  if (Build.VERSION.SDK_INT >= 26) s.setSafeBrowsingEnabled(true);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, compatibilityCookies);
          
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      try {
                          // Inject into the actual embedded video frame, including cross-origin players.
                          // No JavaScript-to-native interface or privileged access is exposed.
                          WebViewCompat.addDocumentStartJavaScript(web, FRAME_SCRIPT, Collections.singleton("*"));
                      } catch(Exception ignored) { /* old WebView uses top-frame fallback */ }
                  }
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                          if (!req.isForMainFrame()) return false;
                          Uri u = req.getUrl();
                          if (allowed(u)) return false;
                          if (isSafePlayerLink(u) && req.hasGesture()) {
                              confirmExternalPlayerLink(u);
                          }
                          return true;
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, String u) {
                          // Android TV 2025 uses the WebResourceRequest override above.
                          return !allowed(Uri.parse(u));
