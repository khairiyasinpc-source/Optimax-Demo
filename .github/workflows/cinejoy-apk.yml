name: Build Cinejoy TV APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate TV app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/personal/tvweblauncher app/src/main/res/drawable
          cat > 'settings.gradle' <<'CINEJOY_FILE_END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CinejoyTv'
          include ':app'
          CINEJOY_FILE_END
          cat > 'build.gradle' <<'CINEJOY_FILE_END'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          CINEJOY_FILE_END
          cat > 'app/build.gradle' <<'CINEJOY_FILE_END'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.personal.tvweblauncher'
            compileSdk 35
            defaultConfig {
              applicationId 'com.personal.tvweblauncher'
              minSdk 23
              targetSdk 32
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          CINEJOY_FILE_END
          cat > 'app/src/main/AndroidManifest.xml' <<'CINEJOY_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <application android:label="Cinejoy TV" android:icon="@android:drawable/ic_media_play"
                android:allowBackup="false" android:usesCleartextTraffic="false"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true"
                  android:screenOrientation="landscape" android:banner="@drawable/tv_banner"
                  android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize">
                  <intent-filter>
                    <action android:name="android.intent.action.MAIN"/>
                    <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.MAIN"/>
                    <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent-filter>
                </activity>
              </application>
          </manifest>
          CINEJOY_FILE_END
          cat > 'app/src/main/java/com/personal/tvweblauncher/MainActivity.java' <<'CINEJOY_FILE_END'
          package com.personal.tvweblauncher;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.SslErrorHandler;
          import android.net.http.SslError;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import java.util.Locale;
          
          public final class MainActivity extends Activity {
              private static final String URL = "https://cinejoy.pk/";
              private FrameLayout root;
              private WebView web;
              private View fullscreen;
              private WebChromeClient.CustomViewCallback fullscreenCallback;
              private Cursor cursor;
              private float x = -1, y = -1;
              private boolean cursorMode = true;
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  immersive();
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(7,10,18));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(7,10,18));
                  root.addView(web, new FrameLayout.LayoutParams(-1,-1));
                  cursor = new Cursor();
                  root.addView(cursor, new FrameLayout.LayoutParams(-1,-1));
                  setContentView(root);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setBuiltInZoomControls(false);
                  if (Build.VERSION.SDK_INT >= 26) s.setSafeBrowsingEnabled(true);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web,false);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                          return req.isForMainFrame() && !allowed(req.getUrl());
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v,String url) {
                          return !allowed(Uri.parse(url));
                      }
                      @Override public void onReceivedSslError(WebView v, SslErrorHandler h, SslError e) {
                          h.cancel();
                          Toast.makeText(MainActivity.this,"HTTPS security error",Toast.LENGTH_LONG).show();
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onShowCustomView(View v,CustomViewCallback cb) {
                          if (fullscreen != null) { cb.onCustomViewHidden(); return; }
                          fullscreen = v;
                          fullscreenCallback = cb;
                          web.setVisibility(View.INVISIBLE);
                          root.addView(v,new FrameLayout.LayoutParams(-1,-1));
                          root.bringChildToFront(cursor);
                          immersive();
                      }
                      @Override public void onHideCustomView() { closeVideo(); }
                  });
                  root.post(() -> {
                      x = root.getWidth()/2f;
                      y = root.getHeight()/2f;
                      cursor.invalidate();
                  });
                  web.loadUrl(URL);
              }
          
              private boolean allowed(Uri u) {
                  if (u == null || !"https".equalsIgnoreCase(u.getScheme()) || u.getHost() == null) return false;
                  String h = u.getHost().toLowerCase(Locale.ROOT);
                  return h.equals("cinejoy.pk") || h.endsWith(".cinejoy.pk");
              }
              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                    View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                    View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                    View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }
              @Override public void onWindowFocusChanged(boolean focus) {
                  super.onWindowFocusChanged(focus);
                  if (focus) immersive();
              }
              private float dp(float n) { return n * getResources().getDisplayMetrics().density; }
              private void move(float dx, float dy) {
                  int w=root.getWidth(),h=root.getHeight();
                  if(w<1||h<1)return;
                  if(x<0)x=w/2f;
                  if(y<0)y=h/2f;
                  x=Math.min(w-8,Math.max(8,x+dx));
                  y=Math.min(h-8,Math.max(8,y+dy));
                  cursor.invalidate();
              }
              private void tap(){
                  View target=fullscreen!=null?fullscreen:web;
                  if(target==null||x<0)return;
                  int[] p=new int[2],q=new int[2];
                  root.getLocationOnScreen(p);
                  target.getLocationOnScreen(q);
                  float tx=x+p[0]-q[0],ty=y+p[1]-q[1];
                  long t=SystemClock.uptimeMillis();
                  MotionEvent down=MotionEvent.obtain(t,t,MotionEvent.ACTION_DOWN,tx,ty,0);
                  MotionEvent up=MotionEvent.obtain(t,t+50,MotionEvent.ACTION_UP,tx,ty,0);
                  target.dispatchTouchEvent(down);
                  target.dispatchTouchEvent(up);
                  down.recycle();up.recycle();
              }
              @Override public boolean dispatchKeyEvent(KeyEvent e){
                  int k=e.getKeyCode();
                  if((k==KeyEvent.KEYCODE_MENU||k==KeyEvent.KEYCODE_SETTINGS) && e.getAction()==KeyEvent.ACTION_UP){
                      menu();return true;
                  }
                  if(k==KeyEvent.KEYCODE_MENU||k==KeyEvent.KEYCODE_SETTINGS)return true;
                  if(cursorMode){
                      if(e.getAction()==KeyEvent.ACTION_DOWN){
                          float step=dp(Math.min(150,56+9*e.getRepeatCount()));
                          switch(k){
                              case KeyEvent.KEYCODE_DPAD_LEFT:move(-step,0);return true;
                              case KeyEvent.KEYCODE_DPAD_RIGHT:move(step,0);return true;
                              case KeyEvent.KEYCODE_DPAD_UP:move(0,-step);return true;
                              case KeyEvent.KEYCODE_DPAD_DOWN:move(0,step);return true;
                              case KeyEvent.KEYCODE_DPAD_CENTER:
                              case KeyEvent.KEYCODE_ENTER:if(e.getRepeatCount()==0)tap();return true;
                          }
                      }else if(e.getAction()==KeyEvent.ACTION_UP){
                          if(k==KeyEvent.KEYCODE_DPAD_LEFT||k==KeyEvent.KEYCODE_DPAD_RIGHT||
                             k==KeyEvent.KEYCODE_DPAD_UP||k==KeyEvent.KEYCODE_DPAD_DOWN||
                             k==KeyEvent.KEYCODE_DPAD_CENTER||k==KeyEvent.KEYCODE_ENTER)return true;
                      }
                  }
                  return super.dispatchKeyEvent(e);
              }
              private void closeVideo(){
                  if(fullscreen==null)return;
                  root.removeView(fullscreen);
                  fullscreen=null;
                  web.setVisibility(View.VISIBLE);
                  if(fullscreenCallback!=null){
                      WebChromeClient.CustomViewCallback cb=fullscreenCallback;
                      fullscreenCallback=null;
                      cb.onCustomViewHidden();
                  }
                  immersive();
              }
              @Override @SuppressWarnings("deprecation") public void onBackPressed(){
                  if(fullscreen!=null){closeVideo();return;}
                  if(web.canGoBack()){web.goBack();return;}
                  menu();
              }
              private void menu(){
                  String mode=cursorMode?"Use D-pad focus mode":"Use remote cursor mode";
                  new AlertDialog.Builder(this).setTitle("Cinejoy TV")
                  .setItems(new String[]{"Reload","Home",mode,"Exit"},(d,n)->{
                      switch(n){
                          case 0:web.reload();break;
                          case 1:web.loadUrl(URL);break;
                          case 2:cursorMode=!cursorMode;cursor.setVisibility(cursorMode?View.VISIBLE:View.GONE);web.requestFocus();break;
                          case 3:finish();break;
                      }
                  }).show();
              }
              @Override protected void onPause(){super.onPause();if(web!=null)web.onPause();}
              @Override protected void onResume(){super.onResume();if(web!=null)web.onResume();}
              @Override protected void onDestroy(){
                  if(fullscreen!=null)closeVideo();
                  if(web!=null){
                      web.stopLoading();
                      web.loadUrl("about:blank");
                      root.removeView(web);
                      web.destroy();
                      web=null;
                  }
                  super.onDestroy();
              }
              private final class Cursor extends View{
                  private final Paint ring=new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint dot=new Paint(Paint.ANTI_ALIAS_FLAG);
                  Cursor(){
                      super(MainActivity.this);
                      setFocusable(false);
                      setClickable(false);
                      ring.setStyle(Paint.Style.STROKE);
                      ring.setStrokeWidth(dp(2.5f));
                      ring.setColor(Color.WHITE);
                      dot.setColor(Color.rgb(90,204,250));
                  }
                  @Override protected void onDraw(Canvas c){
                      if(cursorMode&&x>=0&&y>=0){
                          c.drawCircle(x,y,dp(11),ring);
                          c.drawCircle(x,y,dp(3.5f),dot);
                      }
                  }
              }
          }
          CINEJOY_FILE_END
          cat > 'app/src/main/res/drawable/tv_banner.xml' <<'CINEJOY_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#0B1020"/>
            <corners android:radius="12dp"/>
          </shape>
          CINEJOY_FILE_END
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinejoy-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
