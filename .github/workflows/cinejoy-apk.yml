name: Build Cinejoy TV V4.2 Playback Test
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate TV app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/personal/tvweblauncher app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cat > 'settings.gradle' <<'CINEJOY_FILE_END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CinejoyTv'
          include ':app'
          CINEJOY_FILE_END
          cat > 'build.gradle' <<'CINEJOY_FILE_END'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          CINEJOY_FILE_END
          cat > 'app/build.gradle' <<'CINEJOY_FILE_END'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.personal.tvweblauncher'
            compileSdk 35
            defaultConfig {
              applicationId 'com.personal.tvweblauncher'
              minSdk 23
              targetSdk 32
              versionCode 6
              versionName '4.2'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          CINEJOY_FILE_END
          cat > 'app/src/main/AndroidManifest.xml' <<'CINEJOY_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <application android:label="Cinejoy TV" android:icon="@drawable/app_icon"
                android:allowBackup="false" android:usesCleartextTraffic="false" android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true"
                  android:screenOrientation="landscape" android:banner="@drawable/tv_banner"
                  android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize">
                  <intent-filter>
                    <action android:name="android.intent.action.MAIN"/>
                    <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.MAIN"/>
                    <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent-filter>
                </activity>
              </application>
          </manifest>
          CINEJOY_FILE_END
          cat > 'app/src/main/java/com/personal/tvweblauncher/MainActivity.java' <<'CINEJOY_FILE_END'
          package com.personal.tvweblauncher;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.util.Locale;
          
          public final class MainActivity extends Activity {
              private static final String URL = "https://cinejoy.pk/";
              private static final String NAV_SCRIPT = "(function(){\n if(window.__cinejoyTvReady) return;\n window.__cinejoyTvReady=true;\n // TV focus stays visible, without an on-screen mouse cursor.\n var sheet=document.createElement('style');\n sheet.textContent='a:focus,button:focus,input:focus,select:focus,textarea:focus,[role=\"button\"]:focus,[tabindex]:focus{outline:3px solid #55c9ff!important;outline-offset:3px!important;box-shadow:0 0 0 3px rgba(0,0,0,.55)!important;}';\n (document.head||document.documentElement).appendChild(sheet);\n function visible(el){\n   if(!el||!el.getBoundingClientRect) return false;\n   var r=el.getBoundingClientRect(),s=window.getComputedStyle(el);\n   return r.width>8&&r.height>8&&s.visibility!=='hidden'&&s.display!=='none'&&Number(s.opacity)!==0&&r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth;\n }\n function elems(){\n   return Array.from(document.querySelectorAll('a[href],button,input,select,textarea,[role=\"button\"],[tabindex],[onclick],video'))\n     .filter(visible).slice(0,500);\n }\n window.__cinejoyFocus=function(d){\n   var list=elems(),prev=document.activeElement,current=visible(prev)?prev:null;\n   if(!list.length){ window.scrollBy({top:d==='down'?innerHeight*.6:d==='up'?-innerHeight*.6:0,left:0});return; }\n   if(!current||!list.includes(current)){\n     var best=list.sort((a,b)=>{\n       var ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();\n       var da=Math.abs(ra.left+ra.width/2-innerWidth/2)+Math.abs(ra.top+ra.height/2-innerHeight/2);\n       var db=Math.abs(rb.left+rb.width/2-innerWidth/2)+Math.abs(rb.top+rb.height/2-innerHeight/2);\n       return da-db;\n     })[0];\n     if(best){if(best.matches('[onclick],[role=\"button\"]')&&!best.hasAttribute('tabindex'))best.tabIndex=0;best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'});}\n     return;\n   }\n   var r=current.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bestScore=Infinity;\n   list.forEach(function(el){\n      if(el===current) return;\n      var q=el.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;\n      var forward=d==='up'?-dy:d==='down'?dy:d==='left'?-dx:dx;\n      var cross=(d==='up'||d==='down')?Math.abs(dx):Math.abs(dy);\n      if(forward<6)return;\n      var score=forward+cross*2.5;\n      if(score<bestScore){bestScore=score;best=el;}\n   });\n   if(best){if(best.matches('[onclick],[role=\"button\"]')&&!best.hasAttribute('tabindex'))best.tabIndex=0;best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'});}\n   else {window.scrollBy({top:d==='down'?innerHeight*.55:d==='up'?-innerHeight*.55:0,left:d==='right'?innerWidth*.45:d==='left'?-innerWidth*.45:0});}\n };\n window.__cinejoySelect=function(){\n    var el=document.activeElement;\n    if(el&&el!==document.body&&el!==document.documentElement){el.click();return true;}\n    return false;\n };\n\n // Align Cinejoy's icon dock to the exact viewport centre. Keep its original styling.\n function alignTvDock(){\n  var candidates=[],seen=new Set(),vw=window.innerWidth;\n  if(vw<250)return;\n  var selectors='nav,[role=\"navigation\"],[class*=\"dock\"],[class*=\"Dock\"],[class*=\"bottom-nav\"],[class*=\"BottomNav\"],[class*=\"floating-nav\"],[class*=\"FloatingNav\"]';\n  function consider(el){\n    if(!el||seen.has(el)||el===document.body||el===document.documentElement)return;\n    seen.add(el);\n    var r=el.getBoundingClientRect();\n    if(r.height<38||r.height>180||r.width<vw*.39||r.width>vw*.97)return;\n    if(r.bottom<0||r.top>innerHeight)return;\n    var links=el.querySelectorAll('a,button,[role=\"button\"]');\n    if(links.length<5||links.length>8)return;\n    var icons=el.querySelectorAll('svg,img').length;\n    if(icons<4)return;\n    var st=window.getComputedStyle(el),rad=parseFloat(st.borderTopLeftRadius)||0;\n    var bg=st.backgroundColor;\n    var score=Math.abs(links.length-6)*20+(rad<18?20:0)\n       +(bg==='rgba(0, 0, 0, 0)'||bg==='transparent'?8:0)\n       +Math.abs(vw*.85-r.width)/vw*12;\n    candidates.push({el:el,score:score,rect:r,position:st.position});\n  }\n  document.querySelectorAll(selectors).forEach(consider);\n  if(!candidates.length){\n    var buttons=document.querySelectorAll('a,button,[role=\"button\"]');\n    for(var i=0;i<Math.min(buttons.length,180);i++){\n      if(!visible(buttons[i]))continue;\n      var p=buttons[i].parentElement;\n      for(var depth=0;p&&depth<4&&p!==document.body;depth++,p=p.parentElement)consider(p);\n    }\n  }\n  if(!candidates.length)return;\n  candidates.sort(function(a,b){return a.score-b.score;});\n  var best=candidates[0],n=best.el,r=best.rect;\n  if(n.dataset.cjCenteredDock==='1')return;\n  n.dataset.cjCenteredDock='1';\n  // Preserve vertical placement, width, colour, icons and shadow.\n  // A viewport-anchored dock stays centred across Xiaomi TV resolutions.\n  n.style.setProperty('position','fixed','important');\n  n.style.setProperty('left','50%','important');\n  n.style.setProperty('right','auto','important');\n  n.style.setProperty('top',Math.max(0,r.top)+'px','important');\n  n.style.setProperty('bottom','auto','important');\n  n.style.setProperty('margin-left','0px','important');\n  n.style.setProperty('margin-right','0px','important');\n  n.style.setProperty('transform','translateX(-50%)','important');\n  n.style.setProperty('max-width','calc(100vw - 24px)','important');\n  n.style.setProperty('box-sizing','border-box','important');\n }\n setTimeout(alignTvDock,150);\n setTimeout(alignTvDock,700);\n setTimeout(alignTvDock,1800);\n setTimeout(alignTvDock,4000);\n window.addEventListener('resize',function(){\n   var el=document.querySelector('[data-cj-centered-dock=\"1\"]');\n   if(el)el.style.setProperty('max-width','calc(100vw - 24px)','important');\n });\n // The site renders navigation asynchronously on some pages.\n var observerPending=false;\n var dockObserver=new MutationObserver(function(){\n    if(observerPending)return;\n    observerPending=true;\n    setTimeout(function(){observerPending=false;alignTvDock();},600);\n });\n dockObserver.observe(document.documentElement,{childList:true,subtree:true});\n})();";
              private static final String[] BLOCKED_HOSTS = {
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                  "adservice.google.com", "adnxs.com", "adsrvr.org", "taboola.com",
                  "outbrain.com", "popads.net", "popcash.net", "exoclick.com",
                  "juicyads.com", "propellerads.com", "adsterra.com",
                  "onclickalgo.com", "onclkds.com", "mgid.com",
                  "ad-maven.com", "trafficjunky.net", "hilltopads.net"
              };
              private FrameLayout root;
              private WebView web;
              private View video;
              private WebChromeClient.CustomViewCallback videoCallback;
              private Cursor cursor;
              private float x = -1, y = -1;
              private boolean pointerMode = false;
              private volatile boolean adBlockEnabled = true;
              private boolean compatibilityCookies = true;
              private boolean backMenuHandled = false;
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  adBlockEnabled = getPreferences(MODE_PRIVATE).getBoolean("ad_block", true);
                  compatibilityCookies = getPreferences(MODE_PRIVATE).getBoolean("player_cookies", true);
                  immersive();
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(7,10,18));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(7,10,18));
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  cursor = new Cursor();
                  cursor.setVisibility(View.GONE);
                  root.addView(cursor, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
          
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setBuiltInZoomControls(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setTextZoom(100);
                  s.setLoadsImagesAutomatically(true);
                  if (Build.VERSION.SDK_INT >= 26) s.setSafeBrowsingEnabled(true);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(web, compatibilityCookies);
          
                  web.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                          if (!req.isForMainFrame()) return false;
                          Uri u = req.getUrl();
                          if (allowed(u)) return false;
                          if (isSafePlayerLink(u) && req.hasGesture()) {
                              confirmExternalPlayerLink(u);
                          }
                          return true;
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, String u) {
                          // Android TV 2025 uses the WebResourceRequest override above.
                          return !allowed(Uri.parse(u));
                      }
                      @Override public void onPageFinished(WebView v, String u) {
                          if (allowed(Uri.parse(u))) v.evaluateJavascript(NAV_SCRIPT, null);
                      }
                      @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest req) {
                          Uri u = req.getUrl();
                          if (adBlockEnabled && u != null && isBlocked(u.getHost())) {
                              return new WebResourceResponse("text/plain", "UTF-8", new ByteArrayInputStream(new byte[0]));
                          }
                          return null;
                      }
                      @Override public void onReceivedSslError(WebView v, SslErrorHandler h, SslError e) {
                          h.cancel();
                          Toast.makeText(MainActivity.this, "HTTPS security error", Toast.LENGTH_LONG).show();
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onShowCustomView(View v, CustomViewCallback cb) {
                          if (video != null) { cb.onCustomViewHidden(); return; }
                          video = v;
                          videoCallback = cb;
                          web.setVisibility(View.INVISIBLE);
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          root.addView(v, new FrameLayout.LayoutParams(-1,-1));
                          root.bringChildToFront(cursor);
                          immersive();
                      }
                      @Override public void onHideCustomView() { closeVideo(); }
                  });
                  root.post(() -> {
                      x = root.getWidth()/2f;
                      y = root.getHeight()/2f;
                      cursor.invalidate();
                  });
                  web.requestFocus();
                  web.loadUrl(URL);
              }
          
              private static boolean isBlocked(String host) {
                  if (host == null) return false;
                  String h = host.toLowerCase(Locale.ROOT);
                  for (String domain : BLOCKED_HOSTS)
                      if (h.equals(domain) || h.endsWith("." + domain)) return true;
                  return false;
              }
              private static boolean allowed(Uri u) {
                  if (u == null || !"https".equalsIgnoreCase(u.getScheme()) || u.getHost() == null) return false;
                  String h = u.getHost().toLowerCase(Locale.ROOT);
                  return h.equals("cinejoy.pk") || h.endsWith(".cinejoy.pk");
              }
              private static boolean isSafePlayerLink(Uri uri) {
                  return uri != null && "https".equalsIgnoreCase(uri.getScheme())
                      && uri.getHost() != null && !isBlocked(uri.getHost());
              }
              private void confirmExternalPlayerLink(Uri uri) {
                  String host = uri.getHost();
                  if (host == null) return;
                  new AlertDialog.Builder(this)
                      .setTitle("External video player")
                      .setMessage("This movie wants to open " + host + ". Only continue if you trust the video source.")
                      .setPositiveButton("Open in app", (d,w) -> {
                          web.loadUrl(uri.toString());
                      })
                      .setNeutralButton("Browser", (d,w) -> {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception e) {
                              Toast.makeText(this,"No compatible TV browser found",Toast.LENGTH_SHORT).show();
                          }
                      })
                      .setNegativeButton("Cancel",null)
                      .show();
              }
              private void openCurrentInBrowser() {
                  Uri u = Uri.parse(web.getUrl() == null ? URL : web.getUrl());
                  if (!isSafePlayerLink(u)) return;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW,u));
                  } catch(Exception e) {
                      Toast.makeText(this,"No compatible TV browser installed",Toast.LENGTH_LONG).show();
                  }
              }

              private void immersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }
              @Override public void onWindowFocusChanged(boolean focus) {
                  super.onWindowFocusChanged(focus);
                  if (focus) immersive();
              }
              private float dp(float n) { return n * getResources().getDisplayMetrics().density; }
              private void move(float dx, float dy) {
                  int w = root.getWidth(), h = root.getHeight();
                  if (w < 1 || h < 1) return;
                  if (x < 0) x = w/2f;
                  if (y < 0) y = h/2f;
                  x = Math.min(w-8, Math.max(8, x+dx));
                  y = Math.min(h-8, Math.max(8, y+dy));
                  cursor.invalidate();
              }
              private void tap() {
                  View target = video != null ? video : web;
                  if (target == null || x < 0) return;
                  int[] p = new int[2], q = new int[2];
                  root.getLocationOnScreen(p);
                  target.getLocationOnScreen(q);
                  float tx = x+p[0]-q[0], ty = y+p[1]-q[1];
                  long t = SystemClock.uptimeMillis();
                  MotionEvent down = MotionEvent.obtain(t,t,MotionEvent.ACTION_DOWN,tx,ty,0);
                  MotionEvent up = MotionEvent.obtain(t,t+50,MotionEvent.ACTION_UP,tx,ty,0);
                  target.dispatchTouchEvent(down);
                  target.dispatchTouchEvent(up);
                  down.recycle();
                  up.recycle();
              }
              private void nav(String direction) {
                  if (video != null) return;
                  web.evaluateJavascript("window.__cinejoyFocus&&window.__cinejoyFocus('" + direction + "');", null);
              }
              @Override public boolean dispatchKeyEvent(KeyEvent e) {
                  int key = e.getKeyCode();
                  // Long press Back to open Quick Settings on remotes without a Menu key.
                  if (key == KeyEvent.KEYCODE_BACK) {
                      if (e.getAction() == KeyEvent.ACTION_DOWN &&
                         (e.getRepeatCount() > 0 || e.isLongPress()) && !backMenuHandled) {
                          backMenuHandled = true;
                          menu();
                          return true;
                      }
                      if (e.getAction() == KeyEvent.ACTION_UP && backMenuHandled) {
                          backMenuHandled = false;
                          return true;
                      }
                  }
                  if (key == KeyEvent.KEYCODE_MENU || key == KeyEvent.KEYCODE_SETTINGS) {
                      if (e.getAction() == KeyEvent.ACTION_UP) menu();
                      return true;
                  }
                  if (pointerMode) {
                      if (e.getAction() == KeyEvent.ACTION_DOWN) {
                          float step = dp(Math.min(150,56 + 9 * e.getRepeatCount()));
                          switch (key) {
                              case KeyEvent.KEYCODE_DPAD_LEFT: move(-step,0);return true;
                              case KeyEvent.KEYCODE_DPAD_RIGHT: move(step,0);return true;
                              case KeyEvent.KEYCODE_DPAD_UP: move(0,-step);return true;
                              case KeyEvent.KEYCODE_DPAD_DOWN: move(0,step);return true;
                              case KeyEvent.KEYCODE_DPAD_CENTER:
                              case KeyEvent.KEYCODE_ENTER:
                                  if (e.getRepeatCount() == 0) tap();
                                  return true;
                          }
                      } else if (e.getAction() == KeyEvent.ACTION_UP) {
                          if (key == KeyEvent.KEYCODE_DPAD_LEFT || key == KeyEvent.KEYCODE_DPAD_RIGHT ||
                              key == KeyEvent.KEYCODE_DPAD_UP || key == KeyEvent.KEYCODE_DPAD_DOWN ||
                              key == KeyEvent.KEYCODE_DPAD_CENTER || key == KeyEvent.KEYCODE_ENTER)
                              return true;
                      }
                  } else if (video == null) {
                      if (e.getAction() == KeyEvent.ACTION_DOWN && e.getRepeatCount() == 0) {
                          switch (key) {
                              case KeyEvent.KEYCODE_DPAD_LEFT: nav("left"); return true;
                              case KeyEvent.KEYCODE_DPAD_RIGHT: nav("right"); return true;
                              case KeyEvent.KEYCODE_DPAD_UP: nav("up"); return true;
                              case KeyEvent.KEYCODE_DPAD_DOWN: nav("down"); return true;
                              case KeyEvent.KEYCODE_DPAD_CENTER:
                              case KeyEvent.KEYCODE_ENTER:
                                  web.evaluateJavascript("window.__cinejoySelect&&window.__cinejoySelect();",null);
                                  return true;
                          }
                      }
                      if (e.getAction() == KeyEvent.ACTION_UP) {
                          if (key == KeyEvent.KEYCODE_DPAD_LEFT || key == KeyEvent.KEYCODE_DPAD_RIGHT ||
                              key == KeyEvent.KEYCODE_DPAD_UP || key == KeyEvent.KEYCODE_DPAD_DOWN ||
                              key == KeyEvent.KEYCODE_DPAD_CENTER || key == KeyEvent.KEYCODE_ENTER)
                              return true;
                      }
                  }
                  return super.dispatchKeyEvent(e);
              }
              private void closeVideo() {
                  if (video == null) return;
                  root.removeView(video);
                  video = null;
                  web.setVisibility(View.VISIBLE);
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (videoCallback != null) {
                      WebChromeClient.CustomViewCallback cb = videoCallback;
                      videoCallback = null;
                      cb.onCustomViewHidden();
                  }
                  immersive();
              }
              @Override @SuppressWarnings("deprecation") public void onBackPressed() {
                  if (video != null) { closeVideo(); return; }
                  if (web.canGoBack()) { web.goBack(); return; }
                  menu();
              }
              private void menu() {
                  final String pointer = pointerMode ? "Pointer: ON (switch to clean D-pad)" : "Pointer: OFF (fallback)";
                  final String ads = adBlockEnabled ? "Ad filter: ON" : "Ad filter: OFF";
                  final String cookies = compatibilityCookies ? "Player cookies: ON" : "Player cookies: OFF";
                  new AlertDialog.Builder(this)
                      .setTitle("Cinejoy TV V4.2  •  Quick Settings")
                      .setItems(new String[]{
                          "Home",
                          "Reload this movie",
                          "Retry video with compatibility settings",
                          ads,
                          cookies,
                          "Open this movie in TV browser",
                          pointer,
                          "Exit"
                      },(d,n) -> {
                          switch(n) {
                              case 0: web.loadUrl(URL); break;
                              case 1: web.reload(); break;
                              case 2:
                                  // Debugging mode: ad requests are no longer filtered.
                                  // The user knowingly opts into cross-site player cookies.
                                  adBlockEnabled = false;
                                  compatibilityCookies = true;
                                  CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
                                  web.reload();
                                  Toast.makeText(this,"Compatibility retry ON. Ad filter temporarily OFF",Toast.LENGTH_LONG).show();
                                  break;
                              case 3:
                                  adBlockEnabled = !adBlockEnabled;
                                  getPreferences(MODE_PRIVATE).edit().putBoolean("ad_block",adBlockEnabled).apply();
                                  web.reload();
                                  break;
                              case 4:
                                  compatibilityCookies = !compatibilityCookies;
                                  getPreferences(MODE_PRIVATE).edit().putBoolean("player_cookies",compatibilityCookies).apply();
                                  CookieManager.getInstance().setAcceptThirdPartyCookies(web,compatibilityCookies);
                                  web.reload();
                                  break;
                              case 5: openCurrentInBrowser(); break;
                              case 6:
                                  pointerMode = !pointerMode;
                                  cursor.setVisibility(pointerMode ? View.VISIBLE : View.GONE);
                                  web.requestFocus();
                                  break;
                              case 7: finish(); break;
                          }
                      }).show();
              }
              @Override protected void onPause() { super.onPause(); if(web != null) web.onPause(); }
              @Override protected void onResume() { super.onResume(); if(web != null) web.onResume(); }
              @Override protected void onDestroy() {
                  if (video != null) closeVideo();
                  if (web != null) {
                      web.stopLoading();
                      web.loadUrl("about:blank");
                      root.removeView(web);
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
              private final class Cursor extends View {
                  private final Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint dot = new Paint(Paint.ANTI_ALIAS_FLAG);
                  Cursor() {
                      super(MainActivity.this);
                      setFocusable(false);
                      setClickable(false);
                      ring.setStyle(Paint.Style.STROKE);
                      ring.setStrokeWidth(dp(2.5f));
                      ring.setColor(Color.WHITE);
                      dot.setColor(Color.rgb(90,204,250));
                  }
                  @Override protected void onDraw(Canvas c) {
                      if (pointerMode && x >= 0 && y >= 0) {
                          c.drawCircle(x,y,dp(11),ring);
                          c.drawCircle(x,y,dp(3.5f),dot);
                      }
                  }
              }
          }
          CINEJOY_FILE_END
          cat > 'app/src/main/res/drawable/tv_banner.xml' <<'CINEJOY_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#0B1020"/>
            <corners android:radius="12dp"/>
          </shape>
          CINEJOY_FILE_END
      - name: Add custom Cinejoy TV app icon
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > app/src/main/res/drawable-nodpi/app_icon.png
          file app/src/main/res/drawable-nodpi/app_icon.png
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinejoy-TV-V4.2-Playback-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
