name: Build Cinejoy TV V4.6 Full Controls Auto Hide
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate TV app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/personal/tvweblauncher app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cat > 'settings.gradle' <<'CINEJOY_FILE_END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='CinejoyTv'
          include ':app'
          CINEJOY_FILE_END
          cat > 'build.gradle' <<'CINEJOY_FILE_END'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          CINEJOY_FILE_END
          cat > 'app/build.gradle' <<'CINEJOY_FILE_END'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.personal.tvweblauncher'
            compileSdk 35
            defaultConfig {
              applicationId 'com.personal.tvweblauncher'
              minSdk 23
              targetSdk 32
              versionCode 10
              versionName '4.6'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
          CINEJOY_FILE_END
          cat > 'gradle.properties' <<'CINEJOY_FILE_END'
          android.useAndroidX=true
          android.enableJetifier=false
          CINEJOY_FILE_END
          cat > 'app/src/main/AndroidManifest.xml' <<'CINEJOY_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.hardware.type.television" android:required="false"/>
              <application android:label="Cinejoy TV" android:icon="@drawable/app_icon"
                android:allowBackup="false" android:usesCleartextTraffic="false" android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true"
                  android:screenOrientation="landscape" android:banner="@drawable/tv_banner"
                  android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize">
                  <intent-filter>
                    <action android:name="android.intent.action.MAIN"/>
                    <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>
                  <intent-filter>
                    <action android:name="android.intent.action.MAIN"/>
                    <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                  </intent-filter>
                </activity>
              </application>
          </manifest>
          CINEJOY_FILE_END
          cat > 'app/src/main/java/com/personal/tvweblauncher/MainActivity.java' <<'CINEJOY_FILE_END'
